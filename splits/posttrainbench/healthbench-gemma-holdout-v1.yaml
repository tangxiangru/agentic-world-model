    frozen. The require gates drop unscored runs and the ones the official GPT-5.4
    judge flagged (test-set contamination, disallowed model) before sides are taken.
  by: trained_model  # the base model the agent post-trains, not the agent's own
  test: [google_gemma-3-4b-pt]  # catalogue spelling of HF id google/gemma-3-4b-pt
  require: {accuracy: present, contamination_flagged: false, disallowed_flagged: false}
