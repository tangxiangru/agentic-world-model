# HealthBench trajectories split by base model: gemma-3-4b-pt is held out as
# test, every other base model (Qwen3-4B, Qwen3-1.7B, SmolLM3-3B) is train. The
# catalogue rows behind posttrainbench.com/traces are the population; a run is in
# only if it was scored and carries no contamination or disallowed-model flag.
#
# Why HealthBench and not GSM8K. Measured across all seven PostTrainBench
# benchmarks, GSM8K's headroom is mostly a decoding/format artefact: on
# Qwen3-4B-Base, 62.6% of the gap between the base model and its instruct
# sibling is recovered by prompting alone (few-shot 0.744 vs scored-protocol
# 0.418), so scores there mostly measure whether the agent set `temperature`
# and the EOS token correctly. HealthBench's equivalent share is 21.4%, the
# second lowest of the seven. It is also the only benchmark whose recipe signal
# clears its own noise: repeated evaluation of one unchanged checkpoint moves
# 0.76-1.66 points (four in-trace pairs), while two same-config opus-5 runs
# differ by 16.9 points -- roughly 13:1. GPQA and AIME fail that test (their
# same-weight noise equals the whole between-run gap); BFCL fails on
# contamination (37.2% of its runs are flagged).
#
# Why the flags are a `require` gate and not a footnote. 41 of HealthBench's
# 210 runs are contamination-flagged -- the second highest rate in the suite.
# Reading all 41 judgements: 37 are the same pattern (run the eval, read the
# specific items that failed, hand-write training variants clustered around
# them), 3 copy test text near-verbatim, 1 pulls a mirror of the banned
# `openai/healthbench`. None is the benign "matched the benchmark's general
# style" case that rule 4 of the agent prompt explicitly permits. 28 of the 41
# passed the harness's own n-gram `contamination_check.py` with zero overlap
# before the LLM judge caught them, so the flag is doing work the shipped tool
# cannot. Excluding them also sharpens the signal rather than blunting it: the
# flagged runs average 19.2% against 22.6% for the rest, and every run above
# 0.4 is already outside the flagged set.
#
# Why gemma is the holdout, again. On GSM8K gemma-3-4b-pt is the one base model
# prompting does not help (few-shot 0.058 vs scored 0.061, versus +0.32 for the
# other three), so a GSM8K predictor trained on the other three learns a
# mechanism its test set does not have. On HealthBench that asymmetry is gone:
# gemma's prompting gain is +0.063 against +0.084/+0.102/+0.136, the same order
# of magnitude, and its measured scores sit mid-distribution. Holding it out
# keeps the base-model axis aligned with gsm8k-gemma-holdout-v1 without
# inheriting that split's distribution shift.
#
# One noise source to know about: `evaluation_code/grader.py` takes a separate
# branch for gpt-5-mini that omits `temperature=0`, so every HealthBench score
# in this split carries the judge's own sampling variance. That is the floor the
# 0.76-1.66 point figure above measures.
#
# The dataset pin makes membership reproducible byte-for-byte: run paths resolve
# under https://huggingface.co/datasets/{repo}/resolve/{revision}/<run>/<file>.
# `awm split check posttrainbench/healthbench-gemma-holdout-v1` replays the rule
# over the pinned catalogue and proves these lists still follow from it; the
# lists were generated by that same code path, never by hand. To fetch the runs:
# `awm split fetch posttrainbench/healthbench-gemma-holdout-v1`.
#
# This file is a contract: once anything trains or reports against it, do not
# edit it -- add a -v2 beside it instead.

