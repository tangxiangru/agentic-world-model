hypothesis:
  claim: "Rejection-sampling fine-tuning on self-generated solutions filtered for correct final answers will reduce arithmetic slips on dev-150."
  mechanism: "Correct self-samples show the model its own arithmetic done right, in its own phrasing; the filter removes the slips."
  expected_effect: {metric: accuracy, direction: higher, against: exp-02, magnitude: "+3 to +6 pts on dev-150"}
  falsified_if: "watch-set fixed count < 8 of 41, or dev-150 accuracy below exp-02's 0.58"

setup:
  parent_checkpoint: {path: /home/ben/task/ckpts/exp-02/final, origin: exp-02, hash: null}
  base_model: google/gemma-3-4b-pt
  data:
    - path: /home/ben/task/data/rft_exp03.jsonl
      source: synthetic:self
      n_examples: 2400
      built_by: /home/ben/task/rft_sample.py
      build_command: [python, rft_sample.py, --model, /home/ben/task/ckpts/exp-02/final, --n, "8", --out, data/rft_exp03.jsonl]
      selection: "already produced by exp-02's locked post-training sampling diagnostic; keep ANSWER matches to training gold, max 4 per question, dedup exact; excludes independent dev"
      contamination_check: passed
      mixture_weight: 1.0
  method:
    family: rft
    framework: trl.SFTTrainer 0.27.2
    peft: none
    hyperparams: {lr: 1.0e-5, epochs: 2, batch_size: 8, grad_accum: 2, max_seq_len: 2560, scheduler: cosine, warmup: 0.03, weight_decay: 0.0, precision: bf16, seed: 0}
    target_format: "chain of thought then 'ANSWER: <answer>' then <end_of_turn>; verify actual rendered supervision"
    stop_token: "<end_of_turn>"
    answer_marker: "ANSWER: "
  command:
    argv: [python, train_sft.py, --config, configs/exp03.yaml]
    cwd: /home/ben/task
    script: /home/ben/task/train_sft.py
    env: {}
    log: /home/ben/task/logs/exp-03.log
  output_dir: /home/ben/task/ckpts/exp-03
  checkpoints: {every_steps: 150, keep: last}
  budget: {gpu: H100-80GB, planned_h: 1.5}

