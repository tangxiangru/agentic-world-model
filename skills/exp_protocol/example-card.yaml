problem:
  statement: "The incumbent gets the reasoning right but slips on multi-digit arithmetic inside the chain of thought."
  evidence:
    - {path: /home/ben/task/analysis/exp-02_failure_tags.json, locator: "tag=arithmetic_slip", observation: "41 of 63 dev-150 failures tagged arithmetic_slip"}
  affected_share: 0.65
