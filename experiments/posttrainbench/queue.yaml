# The planner's desired queue. One entry per committed manifest, in priority
# order. The operator reads this every few minutes with `awm ptb reconcile`:
# an entry with `want: submitted` and no receipt is submitted; an entry with
# `want: cancelled` has its still-PENDING jobs cancelled (running jobs are
# never touched); `pilot: first` runs the manifest's pilot cell and waits
# for it to validate before the formal cells go in. `why` is one line for
# the record. Nothing here is executed by the planner.
#
# Operating directive from the user (2026-09-02, recorded in
# doc/spec/2026-09-02-wma-round01-online-gsm8k-gemma4b.md): no pilots; keep
# all 16 GPUs of the gangda_wma_evolve subqueue busy and keep cells pending
# behind them; launch, analyse while running, and drop what turns out wrong
# from the queue (pending cells only; a running cell finishes).
#
# The two wma entries need the history corpus staged once on the cluster at
# /rmeng_data/robtang/wma-history/gsm8k-gemma-holdout-v1-a8b12af/train (the
# spec gives the command); until it exists `awm ptb check` blocks them and
# reconcile retries every round, while the ctl entries submit regardless.
schema_version: 1
entries:
  - manifest: experiments/posttrainbench/wma-gsm8k-gemma4b-high-r01-wma-x8.yaml
    want: submitted
    pilot: null
    why: Round 01 wma arm, core cells 1-8; the first wave's sidecar smoke is these eight formal cells, not a pilot.
  - manifest: experiments/posttrainbench/wma-gsm8k-gemma4b-high-r01-ctl-x8.yaml
    want: submitted
    pilot: null
    why: Round 01 control arm, core cells 1-8; same checkout and protocol, no sidecar; fills the first wave to 16.
  - manifest: experiments/posttrainbench/wma-gsm8k-gemma4b-high-r01-wma-b-x8.yaml
    want: submitted
    pilot: null
    why: Pending buffer behind the first wave (user directive, queue never empty); wma arm observations 9-16, never substitutes for a core cell.
  - manifest: experiments/posttrainbench/wma-gsm8k-gemma4b-high-r01-ctl-b-x8.yaml
    want: submitted
    pilot: null
    why: Pending buffer paired with wma-b-x8; control observations 9-16, never substitutes for a core cell.
