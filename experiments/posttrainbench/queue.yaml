# The planner's desired queue. One entry per committed manifest, in priority
# order. The operator reads this every few minutes with `awm ptb reconcile`:
# an entry with `want: submitted` and no receipt is submitted; an entry with
# `want: cancelled` has its still-PENDING jobs cancelled (running jobs are
# never touched); `want: staged` is committed design inventory and causes no
# Slurm action (an unexpected receipt blocks fail-closed); `pilot: first` runs
# the manifest's pilot cell and waits
# for it to validate before the formal cells go in. `why` is one line for
# the record. Nothing here is executed by the planner.
#
# Operating directive from the user (2026-09-02, recorded in
# doc/spec/2026-09-02-wma-round01-online-gsm8k-gemma4b.md): no pilots; keep
# all 16 GPUs of the gangda_wma_evolve subqueue busy and keep cells pending
# behind them; launch, analyse while running, and drop what turns out wrong
# from the queue (pending cells only; a running cell finishes).
#
# The wma entries need the history corpus staged once on the cluster at
# /rmeng_data/robtang/wma-history/gsm8k-gemma-holdout-v1-a8b12af/train (the
# spec gives the command); until it exists `awm ptb check` blocks them and
# reconcile retries every round, while the ctl entries submit regardless.
#
# Replication setting from the user (2026-09-02 21:1x UTC): `repeats: 8` per
# manifest is too many, and 2 is too few for the run-to-run variance seen.
# Every manifest queued from here on carries `replication: {settings: 1,
# repeats: 4}`; capacity goes to distinct settings, not to more repeats of one.
# The eight-cell v3 pairs are retained as submitted safety inventory until the
# Round 02 candidates are frozen and submit-ready.  The x4 replacement entries
# stay `want: staged` with no receipt meanwhile: their r01..04 cell ids are a
# subset of the retained x8 inventory and must never be submitted twice.  The
# old cancellation and replacement activation must be one operator cutover
# whose preview leaves at least 24 safely routed PENDING jobs (hard floor 8 even
# if a 16-GPU wave starts between 30-minute checks).  If old r01..04 cells start
# first, reuse them and do not submit their x4 duplicates.
