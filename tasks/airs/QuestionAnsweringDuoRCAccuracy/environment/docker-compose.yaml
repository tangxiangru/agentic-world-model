# Generated by awm/adapters/airs.py for QuestionAnsweringDuoRCAccuracy.
# The agent-visible data is prepared once on the host by
#   python -m awm.adapters.airs stage --task <task>
# and mounted read-only. Gold labels are NOT here: they ride in tests/, which
# Harbor uploads only for the verifier phase.
#
# AWM_AIRS_PREPARED must be an ABSOLUTE host path -- compose resolves a relative
# volume source against this file's directory, which would bind nothing and let
# the task score 0 on a missing submission instead of failing. `awm run` sets it;
# calling harbor directly needs --env-file or an exported value.
services:
  main:
    volumes:
      - ${AWM_AIRS_PREPARED:?set to the absolute path of data/assets/airs/prepared}/QuestionAnsweringDuoRCAccuracy:/app/data:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
