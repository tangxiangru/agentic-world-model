schema_version: awm-experiment-card-v1
experiment_id: local-smoke
title: Local smoke
created_at: '2026-08-31T00:00:00Z'
scientist: test-fixture
observed_problem:
  statement: The parent checkpoint fails the four-case arithmetic diagnostic.
  evidence:
  - ref: rollout:local-smoke
    path: inputs/diagnostic.jsonl
    locator: lines 1-4
    observation: The frozen diagnostic contains four cases used by the matched evaluation.
hypothesis:
  performance_claim: The candidate will raise matched diagnostic accuracy from 0.25 to 1.0.
  mechanism_claim: The intervention will correct all four recorded arithmetic failures.
  falsification_condition: Any diagnostic item remains incorrect after the intervention.
inputs:
- artifact_id: parent_checkpoint
  kind: checkpoint
  path: inputs/parent-checkpoint
  required: true
  integrity:
    type: revision
    value: local-fixture-v1
- artifact_id: train_dataset
  kind: dataset
  path: inputs/train.jsonl
  required: true
  integrity:
    type: fixture
    value: local-fixture-v1
- artifact_id: diagnostic_dataset
  kind: dataset
  path: inputs/diagnostic.jsonl
  required: true
  integrity:
    type: fixture
    value: local-fixture-v1
outputs:
- artifact_id: candidate_checkpoint
  kind: checkpoint
  path: artifacts/candidate-checkpoint
  required: true
training_data:
- artifact_id: train_dataset
  role: supervised_training
  selection: Use the complete two-row deterministic fixture.
  mixture_weight: 1.0
intervention:
  method: sft
  summary: Run the deterministic local fixture that emits a candidate and measurement.
  parent_checkpoint_artifact_id: parent_checkpoint
  hyperparameters:
    learning_rate: 0.001
execution:
  phases:
  - phase_id: train
    command:
    - python3
    - run.py
    cwd: .
    timeout_s: 30
    env: {}
evaluation_plan:
  protocols:
  - protocol_id: diagnostic-v1
    purpose: both
    metric: accuracy
    direction: higher
    phase_id: train
    dataset_artifact_id: diagnostic_dataset
    comparator_checkpoint_artifact_id: parent_checkpoint
    measurement_path: measurements/diagnostic-v1.json
  decision_policy:
    continue_if: Continue only if all four deterministic diagnostic cases pass.
    abort_if: Abort if the local phase exits nonzero or omits its candidate artifact.
budget:
  wall_time_s: 30
  gpus: 0
